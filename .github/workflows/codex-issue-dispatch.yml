name: Codex Issue Dispatcher

on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest

    steps:
      - name: Detect issue type
        id: issue-type
        env:
          LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
        run: |
          echo "Issue #${{ github.event.issue.number }}"
          echo "Labels: $LABELS"

          if [[ "$LABELS" == *"bug"* ]]; then
            echo "type=bug" >> "$GITHUB_OUTPUT"
          elif [[ "$LABELS" == *"feature"* ]]; then
            echo "type=feature" >> "$GITHUB_OUTPUT"
          elif [[ "$LABELS" == *"task"* ]]; then
            echo "type=task" >> "$GITHUB_OUTPUT"
          else
            echo "type=unknown" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch to Codex Cloud
        uses: actions/github-script@v8
        env:
          ISSUE_TYPE: ${{ steps.issue-type.outputs.type }}
        with:
          github-token: ${{ secrets.CODEX_ISSUE_DISPATCHER }}
          script: |
            const type = process.env.ISSUE_TYPE;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `@codex

            Please work on this GitHub issue.
            Issue type: ${type}

            Read and follow the repository's AGENTS.md instructions.`
            });
