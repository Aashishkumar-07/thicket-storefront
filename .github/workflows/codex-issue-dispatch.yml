name: Codex Issue Dispatcher

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest

    steps:
      - name: Detect issue type
        id: issue-type
        env:
          LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
        run: |
          echo "Issue #${{ github.event.issue.number }}"
          echo "Labels: $LABELS"

          if [[ "$LABELS" == *"bug"* ]]; then
            echo "type=bug" >> "$GITHUB_OUTPUT"
          elif [[ "$LABELS" == *"feature"* ]]; then
            echo "type=feature" >> "$GITHUB_OUTPUT"
          elif [[ "$LABELS" == *"task"* ]]; then
            echo "type=task" >> "$GITHUB_OUTPUT"
          else
            echo "type=unknown" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch to Codex Cloud
        uses: actions/github-script@v8
        env:
          ISSUE_TYPE: ${{ steps.issue-type.outputs.type }}
        with:
          script: |
            const type = process.env.ISSUE_TYPE;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `@codex

            Please work on this GitHub issue.

            Issue type: ${type}

            Read and follow the repository's AGENTS.md instructions.

            Read the issue title and description carefully, then autonomously
            inspect the repository to understand the relevant implementation.

            Implement the requested change with the smallest appropriate modification.

            Run the relevant tests, linting, and type checking defined by the repository.

            When finished, create a pull request against the default branch.

            Include:

            Closes #${context.issue.number}

            in the pull request description.

            Do not merge the pull request.`
            });
